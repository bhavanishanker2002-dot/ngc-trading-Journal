// Uses Supabase REST API directly — no SDK needed
// Table: nbs_journal (id TEXT PRIMARY KEY, data JSONB, updated_at TIMESTAMPTZ)
// Row ID is always "main" — one row per user
var CLOUD={
  _url:null,_key:null,
  init(url,key){this._url=url.replace(/\/$/,"");this._key=key;},
  async _auth(path,body){
    var r=await fetch(this._url+"/auth/v1/"+path,{method:"POST",headers:{"Content-Type":"application/json","apikey":this._key},body:JSON.stringify(body)});
    var j={};try{j=await r.json()}catch(e){}
    if(!r.ok)throw new Error(j.error_description||j.msg||j.message||("Sign-in failed (HTTP "+r.status+")"));
    return{access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),user_id:j.user&&j.user.id};
  },
  async signIn(email,pw){return this._auth("token?grant_type=password",{email:email,password:pw})},
  async _token(){
    var c=CREDS.get();var s=c&&c.session;
    if(!s||!s.access_token)throw new Error("Not signed in — tap “! fix” and sign in again.");
    if(s.expires_at-Math.floor(Date.now()/1000)>60)return s;
    var self=this;
    if(!this._rf)this._rf=this._auth("token?grant_type=refresh_token",{refresh_token:s.refresh_token}).then(function(ns){c.session=ns;CREDS.set(c);self._rf=null;return ns},function(){self._rf=null;throw new Error("Session expired — tap “! fix” and sign in again.")});
    return this._rf;
  },
  async _h(extra){var s=await this._token();return Object.assign({"Content-Type":"application/json","apikey":this._key,"Authorization":"Bearer "+s.access_token},extra||{})},
  async testConn(){
    var r=await fetch(this._url+"/rest/v1/nbs_journal2?select=user_id&limit=1",{headers:await this._h()});
    if(r.status===404||r.status===400)throw new Error("Table not found. Run the SQL from step 2 first.");
    if(r.status===401||r.status===403)throw new Error("Not allowed. Check the key and that you ran the full SQL.");
    if(!r.ok)throw new Error("Connection failed: HTTP "+r.status);
    return true;
  },
  async read(){
    var r=await fetch(this._url+"/rest/v1/nbs_journal2?select=data&limit=1",{headers:await this._h()});
    if(!r.ok)throw new Error("Read failed: "+r.status);
    var rows=await r.json();
    if(!rows||!rows.length)return null;
    return rows[0].data;
  },
  async write(data){
    var s=await this._token();
    var r=await fetch(this._url+"/rest/v1/nbs_journal2?on_conflict=user_id",{
      method:"POST",
      headers:await this._h({"Prefer":"resolution=merge-duplicates,return=minimal"}),
      body:JSON.stringify({user_id:s.user_id,data:data,updated_at:new Date().toISOString()})
    });
    if(!r.ok){var txt=await r.text();throw new Error("Write failed: "+r.status+" "+txt.substring(0,80));}
  }
};

function scoreEntry(f,hiddenIds,customIds){
  var coreIds=["c1","c2","c3","c4","c5","c6","c7","c8","c9","c10","c11","c12","c13"];
  var visibleCore=coreIds.filter(function(id){return (hiddenIds||[]).indexOf(id)===-1});
  var coreOn=visibleCore.filter(function(id){return !!f[id]}).length;
  var cIds=customIds||[];
  var custOn=cIds.filter(function(id){return f.cust&&f.cust[id]}).length;
  return {score:coreOn+custOn,max:visibleCore.length+cIds.length};
}
function scoreEntryLegacy(f){return["c1","c2","c3","c4","c5","c6","c7","c8","c9","c10","c11","c12","c13"].filter(function(k){return !!f[k]}).length}
function pipSz(p){return p&&p.toUpperCase().includes("JPY")?0.01:0.0001}
function pipVal(p,price){return p&&p.toUpperCase().includes("JPY")?1000/(price||150):10}
function calcLots(pair,entry,sl,riskPct,acct){
  var e=parseFloat(entry),s=parseFloat(sl),r=parseFloat(riskPct),a=parseFloat(acct);
  if(!e||!s||!r||!a||e===s)return null;
  return Math.floor((a*r/100)/(Math.abs(e-s)/pipSz(pair)*pipVal(pair,e))*100)/100;
}
function calcRR(e,sl,tp,dir){
  var ev=parseFloat(e),sv=parseFloat(sl),tv=parseFloat(tp);
  if(!ev||!sv||!tv||ev===sv)return null;

// ── BALANCE HELPERS ──
// When currentBalanceOverride is set:
//   - It IS the real current balance (what you typed = what your account actually shows)
//   - Real net P&L = override - accountSize (not from journal trades)
//   - Tracked trade P&L = sum of journal entries (shown separately)
// When NO override:
//   - Current balance = accountSize + sum of journal trade P&L
function getStartingBal(firm2){
  return parseFloat(firm2.accountSize)||100000;
}
function hasOverride(firm2){
  return firm2&&firm2.currentBalanceOverride!=null&&firm2.currentBalanceOverride!=="";
}
function getOverrideVal(firm2){
  return parseFloat(firm2.currentBalanceOverride)||parseFloat(firm2.accountSize)||100000;
}
function getCurrentBal(firm2,allTrades){
  if(!firm2)return 100000;
  if(hasOverride(firm2))return getOverrideVal(firm2);
  var ft=(allTrades||[]).filter(function(t){return(t.firmIds||[]).includes(firm2.id)});
  return calcStats(ft,firm2.accountSize,firm2.id).bal+nbsOpsTotal(firm2);
}
function getRealNetPL(firm2,allTrades){
  // Real net P&L: override - start, or journal sum if no override
  if(hasOverride(firm2)){
    return getOverrideVal(firm2)-parseFloat(firm2.accountSize);
  }
  var ft=(allTrades||[]).filter(function(t){return(t.firmIds||[]).includes(firm2.id)});
  return calcStats(ft,firm2.accountSize,firm2.id).np;
}
function getTrackedPL(firm2,allTrades){
  // Journal trade P&L only — always from calcStats
  var ft=(allTrades||[]).filter(function(t){return(t.firmIds||[]).includes(firm2.id)});
  return calcStats(ft,firm2.accountSize,firm2.id).np;
}
function currentBalForForm(firm2,trades){
  return getCurrentBal(firm2,trades);
}
function calcStatsWithOverride(trades,acctSize,firmId,firm){
  var baseSize=firm&&hasOverride(firm)?getOverrideVal(firm):parseFloat(acctSize)||100000;
  return calcStats(trades,baseSize,firmId);
}

function rbFmtDate(d){if(!d)return"[DATE]";return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}
function rbMondayOfWeek(d){var t=new Date(d);t.setHours(0,0,0,0);var dow=t.getDay()||7;t.setDate(t.getDate()+1-dow);return t}
function rbThisMonday(){return rbMondayOfWeek(new Date())}
function rbAddD(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r}
function rbMonthStart(offset){var d=new Date();d.setDate(1);d.setHours(0,0,0,0);d.setMonth(d.getMonth()+offset);return d}
function rbBiweekStart(){var d=new Date();return d.getDate()<=15?new Date(d.getFullYear(),d.getMonth(),1):new Date(d.getFullYear(),d.getMonth(),16)}
function rbBiweekEnd(){var d=new Date();return d.getDate()<=15?new Date(d.getFullYear(),d.getMonth(),15):new Date(d.getFullYear(),d.getMonth()+1,0)}
function rbTradesInRange(trades,s,e){return trades.filter(function(t){var d=tRefDate(t);return d&&d>=s&&d<=e})}
function rbClosedIn(tArr){return tArr.filter(function(t){var r=getCanonicalRes(t);return r.outcome&&!r.outcome.includes("Running")&&r.actualPct!==""&&r.actualPct!=null&&!isNaN(parseFloat(r.actualPct))})}
function rbWinRate(tArr){var cl=rbClosedIn(tArr);if(!cl.length)return 0;var w=cl.filter(function(t){return parseFloat(getCanonicalRes(t).actualPct)>0});return Math.round(w.length/cl.length*100)}
function rbNetR(tArr){var cl=rbClosedIn(tArr);return cl.reduce(function(s,t){var rp=parseFloat(t.riskPct||1),ap=parseFloat(getCanonicalRes(t).actualPct||0);return s+(rp>0?ap/rp:0)},0)}
function rbNetPct(tArr){return rbClosedIn(tArr).reduce(function(s,t){return s+(parseFloat(getCanonicalRes(t).actualPct)||0)},0)}
function rbFmtR(n){return(n>=0?"+":"")+n.toFixed(2)+"R"}
function rbFmtPct(n){return(n>=0?"+":"")+n.toFixed(2)+"%"}
function fv(u,k,fb){var v=u&&u[k];return (v!==undefined&&v!==null&&String(v).trim()!=="")?String(v):(fb||"[___]")}

// Auto-populated tiles per report (read-only summary at top of form)
function rbAutoTiles(rptKey,trades,firms,selFirm,rangeOverride){
  var range=rbResolveRange(rptKey,rangeOverride);
  if(selFirm)trades=trades.filter(function(t){return(t.firmIds||[]).indexOf(selFirm.id)>=0});
  var tArr=rbTradesInRange(trades,range.start,range.end);
  // one row per (trade x account) using THAT account's own result
  var rows=[];
  trades.forEach(function(t){
    (t.firmIds||[]).forEach(function(fid){
      if(selFirm&&fid!==selFirm.id)return;
      var f=(firms||[]).find(function(x){return x.id===fid});if(!f)return;
      var r=getAccRes(t,fid);
      if(!nbsIsClosedRes(r))return;
      var d=tRefDate(t,fid);if(!d||d<range.start||d>range.end)return;
      var size=parseFloat(f.accountSize)||0;
      var usd=tradePnl(t,size,fid);if(usd==null)usd=0;
      var pct=parseFloat(r.actualPct);if(isNaN(pct))pct=size>0?usd/size*100:0;
      var rp=parseFloat(t.riskPct);
      rows.push({t:t,fid:fid,size:size,usd:usd,pct:pct,r:rp>0?pct/rp:0,open:parseDate(t.timestamp),key:String(t.pair||"").replace(/[^A-Za-z]/g,"").toUpperCase()+"|"+t.direction});
    });
  });
  // group the same real trade copied/imported on several accounts (same pair+direction, opened within 60 min)
  var groups=[];
  rows.slice().sort(function(a,b){return(a.open||0)-(b.open||0)}).forEach(function(r){
    var g=groups.find(function(g){return g.key===r.key&&r.open&&g.open&&Math.abs(r.open-g.open)<=3600000&&!g.fids[r.fid]});
    if(g){g.rows.push(r);g.fids[r.fid]=1}else{var o={};o[r.fid]=1;groups.push({key:r.key,open:r.open,rows:[r],fids:o})}
  });
  var nAcc={};rows.forEach(function(r){nAcc[r.fid]=r.size});
  var accList=Object.keys(nAcc);
  var capital=accList.reduce(function(s,k){return s+nAcc[k]},0);
  var netUsd=rows.reduce(function(s,r){return s+r.usd},0);
  var netPctC=capital>0?netUsd/capital*100:0;
  var wins=groups.filter(function(g){return g.rows.reduce(function(s,r){return s+r.usd},0)>0}).length;
  var netRv=groups.reduce(function(s,g){return s+g.rows.reduce(function(a,r){return a+r.r},0)/g.rows.length},0);
  var cl=groups;
  var multi=!selFirm&&accList.length>1;
  if(multi){tArr=groups.map(function(g){return g.rows[0].t})}
  var openList=trades.filter(function(t){return nbsIsOpenTrade(t,selFirm?selFirm.id:null)});
  var openCount=openList.length;
  var tradesTile=multi?(groups.length+" trades · "+accList.length+" accounts · "+rows.length+" account-trades"):(rows.length+" closed");
  var tiles=[
    ["Period",rbFmtDate(range.start)+" — "+rbFmtDate(range.end)],
    ["Trades in Period",tradesTile],
    ["Win Rate (period)",cl.length?Math.round(wins/cl.length*100)+"%":"—"],
    ["Net R (period)",cl.length?rbFmtR(netRv):"—"],
    [multi?"Net P&L (all accounts)":"Net % (period)",cl.length?(multi?((netUsd>=0?"+$":"-$")+Math.abs(Math.round(netUsd)).toLocaleString())+" ("+rbFmtPct(netPctC)+" of $"+Math.round(capital).toLocaleString()+" combined)":rbFmtPct(netPctC)):"—"],
    ["Open (Running) — not counted",openCount?String(openCount)+": "+openList.slice(0,4).map(function(t){return(t.pair||"")+" "+(t.direction||"")}).join(", "):"0"],
  ];
  if(selFirm){
    var ft=trades.filter(function(t){return(t.firmIds||[]).indexOf(selFirm.id)>=0});
    var st=calcStats(ft,selFirm.accountSize,selFirm.id);
    var ddPct=st.hwm>0?((st.hwm-st.bal)/st.hwm*100):0;
    var status=ddPct<3?"Green — Normal":ddPct<5?"Amber — Drawdown":"Red — Near Limit";
    tiles.push(["Account",selFirm.name]);
    var realB=(selFirm.currentBalanceOverride!=null&&selFirm.currentBalanceOverride!==""&&!isNaN(parseFloat(selFirm.currentBalanceOverride)))?parseFloat(selFirm.currentBalanceOverride):st.bal+nbsOpsTotal(selFirm);
    tiles.push(["Balance","$"+realB.toLocaleString(undefined,{maximumFractionDigits:0})]);
    tiles.push(["Status",status]);
  }
  return {tiles:tiles,trades:tArr,range:range};
}
function rbResolveRange(rptKey,override){var r0=rbResolveRangeRaw(rptKey,override);var e0=new Date(r0.end);e0.setHours(23,59,59,999);return{start:r0.start,end:e0}}
function rbResolveRangeRaw(rptKey,override){
  if(override&&override.start&&override.end)return override;
  var def=REPORT_FIELDS[rptKey];
  if(!def)return {start:rbThisMonday(),end:rbAddD(rbThisMonday(),4)};
  if(def.period==="week"){var s=rbThisMonday();return {start:s,end:rbAddD(s,4)}}
  if(def.period==="lastWeek"){var s=rbThisMonday();s.setDate(s.getDate()-7);return {start:s,end:rbAddD(s,4)}}
  if(def.period==="biweek"){return {start:rbBiweekStart(),end:rbBiweekEnd()}}
  if(def.period==="lastBiweek"){var s=rbBiweekStart();var s2=new Date(s);s2.setDate(s2.getDate()-14);var e2=new Date(s);e2.setDate(e2.getDate()-1);return {start:s2,end:e2}}
  if(def.period==="month"){var s=rbMonthStart(0);var e=rbMonthStart(1);e.setDate(e.getDate()-1);return {start:s,end:e}}
  if(def.period==="outlook"){var s=new Date();var e=new Date();e.setMonth(e.getMonth()+6);return {start:s,end:e}}
  return {start:rbThisMonday(),end:rbAddD(rbThisMonday(),4)}
}

// Compact NGC-styled docx builder driven by REPORT_FIELDS
function rbBuildDocx(rptKey,u,trades,firms,selFirm,rangeOverride){
  var d=window.docx;
  if(!d)throw new Error("docx library not loaded — refresh page");
  var Document=d.Document,Packer=d.Packer,Paragraph=d.Paragraph,TextRun=d.TextRun;
  var Table=d.Table,TableRow=d.TableRow,TableCell=d.TableCell;
  var HeadingLevel=d.HeadingLevel,AlignmentType=d.AlignmentType,BorderStyle=d.BorderStyle;
  var WidthType=d.WidthType,ShadingType=d.ShadingType;

  // Per-trade debrief (weekly/biweekly review)

    var debriefs=(u&&u.tradeDebriefs)||{};
    var dTrades=rbClosedIn(auto.trades);

    } else {

        var dbr=debriefs[t.id]||{};
        var r=getCanonicalRes(t);
        var ap=parseFloat(r.actualPct||0),rp=parseFloat(t.riskPct||1);

        kids.push(h2("Trade #"+(i+1)+" — "+(t.pair||"?")+" "+(t.direction||"")+"  "+actualR));
        kids.push(tw([
          ["Date",t.timestamp?t.timestamp.substring(0,12):"—"],

    children:kids

    ]},
    sections:[section]
  });
  return {doc:doc,Packer:Packer};
}

      if(touch&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(function(){});return}
      var url=URL.createObjectURL(new Blob([txt],{type:"application/json"}));
      var a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();
      setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url)},1500);
    }catch(ex){alert("Couldn't create the backup file: "+ex.message+". Use load → “Copy backup text” instead.")}
  }
  function restoreFrom(text){
    var d;try{d=JSON.parse(text)}catch(ex){alert("That isn't a valid backup (couldn't read it as JSON).");return false}
    if(!d||typeof d!=="object"||(!Array.isArray(d.trades)&&!Array.isArray(d.firms))){alert("That file has no trades or accounts in it, so I did not load it.");return false}
    var n=Array.isArray(d.trades)?d.trades.length:0;
    if(!window.confirm("Replace everything on this device with this backup?\n"+n+" trades, "+(Array.isArray(d.firms)?d.firms.length:0)+" accounts.\n(Save a backup first if you're unsure.)"))return false;
    if(Array.isArray(d.trades))setTrades(d.trades);if(Array.isArray(d.firms))setFirms(d.firms);if(d.rules)setRules(d.rules);if(d.biz)setBiz(d.biz);
    alert("Loaded "+n+" trades.");return true;
  }
  function importBk(){setShowRestore(true)}
  function importCsv(){
    var inp=document.createElement("input");inp.type="file";inp.accept=".csv,text/csv";
    inp.onchange=function(e){
      var f=e.target.files[0];if(!f)return;
      var r=new FileReader();
      r.onload=function(ev){
        try{
          var lines=String(ev.target.result).replace(/\r/g,"").split("\n").filter(function(x){return x.trim()});
          if(lines.length<2){alert("CSV needs a header row and at least one trade.");return}
          function split(line){var out=[],cur="",q=false;for(var i=0;i<line.length;i++){var ch=line[i];if(ch==='"'){q=!q;continue;}if(ch===","&&!q){out.push(cur);cur="";continue;}cur+=ch;}out.push(cur);return out;}
          var headers=split(lines[0]).map(function(h){return h.trim().toLowerCase().replace(/\s+/g,"")});
          function col(row,names){for(var i=0;i<names.length;i++){var ix=headers.indexOf(names[i]);if(ix>=0)return(row[ix]||"").trim()}return""}
          var added=[];
          for(var li=1;li<lines.length;li++){
            var row=split(lines[li]);
            var pair=col(row,["pair","symbol","instrument","ticker"]);
            var dir=(col(row,["direction","side","type"])||"").toUpperCase();
            if(dir==="LONG")dir="BUY";if(dir==="SHORT")dir="SELL";
            if(!pair)continue;
            var pct=col(row,["actualpct","pnl%","pnlpct","return"]);
            var outcome=col(row,["outcome","result"]);
            if(!outcome&&pct){var n=parseFloat(pct);outcome=n>0?"Win — TP Hit":n<0?"Loss — SL Hit":"Breakeven"}
            added.push({id:Date.now()+li,timestamp:col(row,["timestamp","date","time","opendate"])||new Date().toISOString().slice(0,16),pair:pair,direction:dir==="SELL"?"SELL":"BUY",entry:col(row,["entry","entryprice","open"]),sl:col(row,["sl","stop","stoploss"]),tp:col(row,["tp","target","takeprofit"]),riskPct:col(row,["riskpct","risk"])||"1",setupType:col(row,["setuptype","setup","playbook","strategy"]),session:col(row,["session"]),marketRegime:col(row,["regime","marketregime"]),lots:col(row,["lots","size","qty"]),firmIds:[],accountResults:{},outcome:outcome,actualPct:pct,tags:col(row,["tags","tag"]),tradeStatus:"TOOK",rr:null});
          }
          if(!added.length){alert("No rows mapped. Use headers like pair,direction,entry,sl,tp,actualPct,timestamp,setupType");return}
          setTrades(function(p){return added.concat(p)});
          alert("Imported "+added.length+" CSV rows. Assign accounts on each trade if needed.");
        }catch(ex){alert("CSV import failed: "+ex.message)}
      };
      r.readAsText(f);
    };
    inp.click();
  }

  if(showCloud)return h(CloudSetup,{onDone:function(c,data){
    if(c){
      setCreds(c);cloudReady.current=false;
      setSyncMsg("Supabase connected ✓");setSyncStatus("synced");setTimeout(pullCloud,50);
    }else{setSyncMsg("Saved locally");setSyncStatus("")}
    setShowCloud(false);
  }});

  function addTrade(t){setTrades(function(p){return [t].concat(p)})}
  function updateTrade(id,data){setTrades(function(p){return p.map(function(t){return t.id===id?Object.assign({},t,data):t})})}
  function deleteTrade(id){if(window.confirm("Delete this trade?"))setTrades(function(p){return p.filter(function(t){return t.id!==id})})}
  function importTrades(list,patch,updates,fid0,removeIds){
    updates=updates||{};var rm={};(removeIds||[]).forEach(function(id){rm[id]=1});
    setTrades(function(p){return list.concat(p.filter(function(t){return !rm[t.id]}).map(function(t){return updates[t.id]?Object.assign({},t,updates[t.id]):t}))});
    var fid=fid0!=null?fid0:(list.length?list[0].firmIds[0]:null);
    if(patch&&Object.keys(patch).length&&fid!=null){setFirms(function(p){return p.map(function(f){return f.id===fid?Object.assign({},f,patch):f})})}
  }
  function addFirm(f){setFirms(function(p){return p.concat([f])})}
  function updateFirm(id,data){setFirms(function(p){return p.map(function(f){return f.id===id?Object.assign({},f,data):f})})}
  function deleteFirm(id){setFirms(function(p){return p.filter(function(f){return f.id!==id})});setTrades(function(p){return p.map(function(t){return Object.assign({},t,{firmIds:(t.firmIds||[]).filter(function(x){return x!==id})})})})}

  var syncColor=syncStatus==="synced"?"#059669":syncStatus==="syncing"?"#b45309":syncStatus==="error"?"#dc2626":"#444";
	var navItems=[{id:"journal",l:"Journal"},{id:"calendar",l:"Calendar"},{id:"firms",l:"Accounts"},{id:"payouts",l:"Payouts"},{id:"edge",l:"Edge"},{id:"rules",l:"Rules"},{id:"news",l:"News"},{id:"performance",l:"Performance"},{id:"reports",l:"Reports"},{id:"new",l:"+ Trade"}];
  return h("div",{style:{minHeight:"100vh",background:"linear-gradient(180deg,#fafafa 0%,#f4f4f4 42%,#f4f4f4 100%)"}},
    showRestore&&h(RestoreModal,{onClose:function(){setShowRestore(false)},onRestore:restoreFrom,getText:bkText}),
    h("div",{style:{position:"sticky",top:0,zIndex:50,background:"rgba(255,255,255,.88)",backdropFilter:"blur(16px)",borderBottom:"1px solid #e6e6e6"}},
      h("div",{style:{maxWidth:720,margin:"0 auto",padding:"9px 13px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:7,flexWrap:"wrap"}},
        h("div",null,
          h("div",{style:{fontFamily:"'DM Sans',sans-serif",fontSize:8,letterSpacing:4,color:"#111111",textTransform:"uppercase",marginBottom:1}},"NBS Trading"),
          h("div",{style:{fontFamily:"'DM Sans',sans-serif",fontSize:20,letterSpacing:-0.3,fontWeight:700,color:"#111111",lineHeight:1}},"Journal")
        ),
        h("div",{style:{display:"flex",gap:3,flexWrap:"wrap",alignItems:"center"}},
          navItems.map(function(n){return h("button",{key:n.id,onClick:function(){setPage(n.id)},style:Object.assign({},BS,{padding:"6px 10px",fontSize:10,background:page===n.id?(n.id==="new"?"rgba(109,74,255,.12)":"#111111"):"none",border:"1px solid "+(page===n.id?(n.id==="new"?"rgba(109,74,255,.25)":"#e6e6e6"):"transparent"),color:page===n.id?(n.id==="new"?"#111111":"white"):"#555"})},n.l)}),
          h("div",{style:{display:"flex",gap:3,marginLeft:3}},
            h("button",{onClick:syncStatus==="error"?function(){CREDS.clear();setCreds(null);setShowCloud(true)}:creds?manualSync:function(){setShowCloud(true)},style:Object.assign({},BS,{padding:"6px 9px",fontSize:9,background:syncStatus==="error"?"rgba(255,68,68,.1)":"none",border:"1px solid "+(syncStatus==="error"?"rgba(255,68,68,.3)":creds?"#e6e6e6":"rgba(56,189,248,.2)"),color:creds?syncColor:"#0369a1"})},syncStatus==="error"?"! fix":creds?(syncStatus==="syncing"?"~":"⊙"):"+Sync"),
            h("button",{onClick:exportBk,style:Object.assign({},BS,{padding:"6px 9px",fontSize:9,background:"none",border:"1px solid #dcdcdc",color:"#555"})},"save"),
            h("button",{onClick:importBk,style:Object.assign({},BS,{padding:"6px 9px",fontSize:9,background:"none",border:"1px solid #dcdcdc",color:"#555"})},"load"),
            h("button",{onClick:toggleTheme,title:"Switch light / dark",style:Object.assign({},BS,{padding:"6px 9px",fontSize:9,background:"none",border:"1px solid #dcdcdc",color:"#555"})},theme==="dark"?"☀ light":"☾ dark"),
            h("button",{onClick:importCsv,style:Object.assign({},BS,{padding:"6px 9px",fontSize:9,background:"none",border:"1px solid #dcdcdc",color:"#555"})},"csv"),
            installPrompt&&h("button",{onClick:function(){installPrompt.prompt()},style:Object.assign({},BS,{padding:"6px 9px",fontSize:9,background:"rgba(109,74,255,.08)",border:"1px solid rgba(109,74,255,.2)",color:"#111111"})},"install")
          )
        )
      ),
      syncMsg&&h("div",{style:{fontFamily:"'DM Sans',sans-serif",fontSize:9,color:syncColor,letterSpacing:1,textAlign:"center",padding:"2px 0 4px",borderTop:"1px solid #e6e6e6"}},syncMsg)
    ),
    h("div",{style:{maxWidth:720,margin:"0 auto",padding:"15px 13px"}},
      page==="new"&&h(NewTradeForm,{onSave:function(t){addTrade(t);setPage("journal")},onCancel:function(){setPage("journal")},firms:firms,trades:trades}),
      page==="journal"&&h(JournalPage,{trades:trades,firms:firms,onUpdate:updateTrade,onDelete:deleteTrade,jumpTradeId:jumpTradeId,onJumpConsumed:function(){setJumpTradeId(null)}}),
      page==="payouts"&&h(BizHub,{firms:firms,onUpdate:updateFirm,biz:biz,setBiz:setBiz}),
      page==="calendar"&&h("div",{className:"fade"},h(FpCalendar,{trades:trades,firms:firms,onOpenTrade:function(t){setJumpTradeId(t.id);setPage("journal")}})),
      page==="firms"&&h(FirmsPage,{onImportTrades:importTrades,firms:firms,trades:trades,onUpdate:updateFirm,onDelete:deleteFirm,onAdd:addFirm,onReorder:function(arr){setFirms(arr)},onUpdateTrade:updateTrade,onDeleteTrade:deleteTrade}),
      page==="rules"&&h(RulesPage,{rules:rules,onUpdate:function(r){setRules(r)}}),
      page==="news"&&h(ForexNews,null),
      page==="edge"&&h(EdgePage,{trades:trades,firms:firms}),
		page==="performance"&&h(PerformancePage,{trades:trades,firms:firms}),
		page==="reports"&&h(ReportsPage,{trades:trades,firms:firms})
    )
  );
}
